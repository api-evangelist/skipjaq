name: Skipjaq
description: >-
  Skipjaq, Inc. was a machine-learning performance-optimisation startup that marketed itself as
  "Performance Optimisation as a Service" and was backed by Accel. Its proprietary automated
  workload-optimisation software ran repeated optimization tests against a customer's application
  (hosted in the cloud on AWS EC2 instances behind Elastic Load Balancers) and used machine
  learning to tune configuration for better application performance, throughput, and latency
  without manual, expert tuning. The product was delivered as a cloud SaaS and was offered under a
  beta test agreement. The company is now defunct: the skipjaq.com domain no longer resolves on any
  common TLD (.com/.io/.ai/.co.uk all return no A/NS records as of 2026-07-21), the last archived
  snapshot of the site dates to May 2025, and there is no public developer portal, OpenAPI/Swagger
  specification, first-party SDK, or live API surface. This profile was surfaced as an Accel
  portfolio lead.
